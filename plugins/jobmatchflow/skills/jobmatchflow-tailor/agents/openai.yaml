interface:
  display_name: "JobMatchFlow Tailor"
  short_description: "Create and verify two tailored LaTeX PDFs"
  brand_color: "#2563EB"
  default_prompt: "Use $jobmatchflow-tailor to create, review, locally render, verify, and upload a tailored CV and Cover Letter for one JobMatchFlow job."

dependencies:
  tools:
    - type: "mcp"
      value: "jobmatchflow"
      description: "JobMatchFlow facts, jobs, saved Cover Letter content, and final material uploads"

policy:
  allow_implicit_invocation: false
