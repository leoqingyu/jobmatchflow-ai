interface:
  display_name: "JobMatchFlow Materials Setup"
  short_description: "Configure the shared local LaTeX toolchain"
  brand_color: "#2563EB"
  default_prompt: "Use $jobmatchflow-materials-setup to check and, only if necessary, configure my system-wide JobMatchFlow LaTeX environment."

dependencies:
  tools:
    - type: "mcp"
      value: "jobmatchflow"
      description: "JobMatchFlow candidate and application data used after local environment setup"

policy:
  allow_implicit_invocation: true
